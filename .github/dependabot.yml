version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:00"  # 1st of the month, 05:00 Melbourne
      timezone: "Australia/Melbourne"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    target-branch: "main"
    assignees: ["cohenrobinson"]
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 3
    # Bundle routine action minor/patch bumps into one PR; majors stay separate for review.
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Keep the OSS-Fuzz base image in .clusterfuzzlite/Dockerfile current.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "monthly"
      time: "05:00"  # 1st of the month, 05:00 Melbourne
      timezone: "Australia/Melbourne"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    target-branch: "main"
    assignees: ["cohenrobinson"]
    labels: ["dependencies", "docker"]
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"  # Saturday 05:00 Melbourne, ahead of the 08:30 PR sweep
      timezone: "Australia/Melbourne"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    target-branch: "main"
    assignees: ["cohenrobinson"]
    labels: ["dependencies", "pip"]
    open-pull-requests-limit: 5
    # Group routine bumps together so we don't flood the PR queue.
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        patterns:
          - "pytest*"
          - "mypy"
          - "build"
          - "twine"
          - "ruff"
          - "pre-commit"
      # Bundle runtime extras (pandas/pyarrow) minor/patch bumps; majors stay separate.
      runtime-extras-minor-patch:
        patterns:
          - "pandas"
          - "pyarrow"
        update-types:
          - "minor"
          - "patch"
  # Hash-pinned CI requirements (dev/lint/build/audit) — Dependabot keeps
  # the wheel hashes fresh so we don't have to re-run pip-compile by hand.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "05:00"  # Saturday 05:00 Melbourne, ahead of the 08:30 PR sweep
      timezone: "Australia/Melbourne"
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    target-branch: "main"
    assignees: ["cohenrobinson"]
    labels: ["dependencies", "pip"]
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      ci-requirements:
        patterns:
          - "*"
